image: $CROPS_IMAGE

variables:
  # Overridable so a fork can point build-job at its own pullable image (eg if the canonical
  # oeros/aws-runner registry path below isn't reachable from a personal fork's CI) without
  # editing this file: set CROPS_IMAGE as a project or group CI/CD variable (Settings > CI/CD >
  # Variables) in the fork instead. config-check below doesn't use this image at all.
  CROPS_IMAGE: $CI_REGISTRY/oeros/aws-runner/crops-container:latest
  OE_RELEASE_SERIES:
    description: "The Yocto Project release"
    value: master
    options:
      - scarthgap
      - wrynose
      - master
  ROS_DISTRO:
    description: "The ROS distro"
    value: rolling
    options:
      - noetic
      - humble
      - jazzy
      - kilted
      - lyrical
      - rolling
  TARGET_RECIPE: "ros-image-core"
  MACHINE:
    description: "The Yocto Board Support Package"
    value: "raspberrypi5"
    options:
      - "qemux86-64"
      - "raspberrypi0-2w-64"
      - "raspberrypi4-64"
      - "raspberrypi5"
  GITLAB_REDIRECT:
    description: "Redirect git requests for GitHub back to GitLab"
    value: Disabled
    options:
      - Enabled
      - Disabled
  ENABLE_AWS_SUPPORT:
    description: "Install AWS CLI and add awsci.yml"
    value: Enabled
    options:
      - Enabled
      - Disabled
  FF_DISABLE_UMASK_FOR_DOCKER_EXECUTOR: true
  GIT_STRATEGY: clone
  GIT_CLEAN_FLAGS: -fdx
  KAS_WORK_DIR: $CI_PROJECT_DIR/work
  KAS_BUILD_DIR: $KAS_WORK_DIR/build
  KAS_REPO_REF_DIR: $CI_PROJECT_DIR/repos
  CACHE_DIR: $CI_BUILDS_DIR/persist
  SSTATE_DIR: $CACHE_DIR/sstate
  DL_DIR: $CACHE_DIR/downloads
  TOOLCHAIN_DIR: $CACHE_DIR/toolchains
  IMAGE_DIR: $KAS_BUILD_DIR/tmp/deploy/images
  TOOLCHAIN_LINK_DIR: $KAS_BUILD_DIR/toolchains


.default:
  stage: build
  interruptible: true
  before_script:
    - rm -rf $KAS_WORK_DIR
    - mkdir --verbose --parents $KAS_WORK_DIR $KAS_REPO_REF_DIR $SSTATE_DIR $DL_DIR $TOOLCHAIN_DIR $TOOLCHAIN_LINK_DIR $IMAGE_DIR
    - if [ "$GITLAB_REDIRECT" == "Enabled" ]; then git config --global url."${CI_SERVER_PROTOCOL}://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}:${CI_SERVER_PORT}/github/".insteadOf "git://github.com/"; fi
    - if [ "$GITLAB_REDIRECT" == "Enabled" ]; then git config --global url."${CI_SERVER_PROTOCOL}://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}:${CI_SERVER_PORT}/github/".insteadOf "https://github.com/"; fi
    - if [ "$ENABLE_AWS_SUPPORT" == "Enabled" ]; then bash scripts/install_awscli.sh; fi
    - if [ -n "$VIRTUAL_ENV_PKGS" ]; then bash scripts/create_virtualenv.sh "${CI_PROJECT_DIR}" "meta-virtualenv" "${VIRTUAL_ENV_PKGS}"; echo "DEBUG ${CI_PROJECT_DIR}/meta-virtualenv/layer.conf"; cat "${CI_PROJECT_DIR}/meta-virtualenv/conf/layer.conf"; fi



    
config-check:
  stage: build
  image: python:3.12-slim
  interruptible: true
  # Verifies the generated kas/oeros-*.yml files and the README's matrix table haven't drifted
  # from matrix.yml, the single source of truth (docs/kas-to-fragments-migration-spec.md section
  # 3.3). Deliberately kept separate from build-job: it needs no kas checkout, no bitbake, and no
  # MACHINE/ROS_DISTRO/OE_RELEASE_SERIES selection, so it can run automatically on every pipeline
  # instead of the manual, per-combination build below.
  before_script:
    - pip3 install pyyaml
  script:
    - python3 scripts/generate-kas.py --check
    - python3 scripts/check-readme-table.py

smoke-equivalence:
  stage: build
  image: python:3.12-slim
  interruptible: true
  timeout: 1h
  # Nightly-only, real-network smoke test (spec section 4/Phase 6): runs an actual kas checkout and
  # an actual bitbake-setup init for one representative fragment-capable cell
  # (wrynose/rolling/qemux86-64) and diffs their resolved bitbake configuration with
  # scripts/validate-equivalence.py. Deliberately separate from config-check above: this one clones
  # the real layer set and runs bitbake-getvar, real minutes of network/CPU cost rather than
  # seconds, so it only runs when triggered by a scheduled pipeline (create one under this
  # project's Settings > CI/CD > Schedules -- a rules: entry here cannot create that schedule
  # itself, only gate on one already existing).
  #
  # --ignore-vars excludes three differences already found and documented running the first live
  # kas-vs-bitbake-setup comparison (docs/kas-to-fragments-migration-spec.md revision 6):
  # TEMPLATECONF has no bitbake-setup equivalent; OE_FRAGMENTS differs because
  # oeros/allow-commercial-licenses is enabled unconditionally per (release, ros_distro) group
  # (no per-machine conditioning in oe-fragments-one-of); BBLAYERS differs because bitbake-setup's
  # bb-layers is the union of every machine in the group, a confirmed strict superset of this one
  # machine's actual layers. None are regressions -- they are permanent, understood consequences of
  # the one-JSON-file-per-group design (spec section 5 Phase 4).
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  variables:
    RELEASE: wrynose
    SMOKE_ROS_DISTRO: rolling
    SMOKE_MACHINE: qemux86-64
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git
    - pip3 install kas bitbake-setup pyyaml
  script:
    - python3 scripts/extract-config-vars.py
      "kas/oeros-${RELEASE}-${SMOKE_ROS_DISTRO}-${SMOKE_MACHINE}.yml"
      --work-dir "${CI_PROJECT_DIR}/smoke/kas-side" --out "${CI_PROJECT_DIR}/smoke/kas-snapshot.json"
    - git clone --branch "${RELEASE}" --depth 1 https://github.com/robwoolley/meta-oeros.git "${CI_PROJECT_DIR}/smoke/meta-oeros-registry"
    - bitbake-setup --setting default top-dir-prefix "${CI_PROJECT_DIR}/smoke/bbsetup-side"
      init "${CI_PROJECT_DIR}/smoke/meta-oeros-registry/conf/registry/configurations/oeros-${RELEASE}-${SMOKE_ROS_DISTRO}.conf.json"
      "oeros-${RELEASE}-${SMOKE_ROS_DISTRO}" "machine/${SMOKE_MACHINE}" --non-interactive
    - python3 scripts/extract-config-vars.py
      "kas/oeros-${RELEASE}-${SMOKE_ROS_DISTRO}-${SMOKE_MACHINE}.yml"
      --work-dir "${CI_PROJECT_DIR}/smoke/bbsetup-side/bitbake-builds/oeros-${RELEASE}-${SMOKE_ROS_DISTRO}"
      --skip-checkout --out "${CI_PROJECT_DIR}/smoke/bbsetup-snapshot.json"
    - python3 scripts/validate-equivalence.py
      "${CI_PROJECT_DIR}/smoke/kas-snapshot.json" "${CI_PROJECT_DIR}/smoke/bbsetup-snapshot.json"
      --cell "${RELEASE}-${SMOKE_ROS_DISTRO}-${SMOKE_MACHINE}"
      --ignore-vars TEMPLATECONF,OE_FRAGMENTS,BBLAYERS
      --report-json "${CI_PROJECT_DIR}/smoke/report.json"
  artifacts:
    name: "smoke-equivalence-report"
    when: always
    expire_in: 1 week
    paths:
      - smoke/report.json
      - smoke/kas-snapshot.json
      - smoke/bbsetup-snapshot.json

build-job:
  stage: build
  extends: .default
  rules:
    - when: manual
  script:
    - export PATH="$HOME/.local/bin:$PATH"
    - virtualenv venv
    - source venv/bin/activate
    - pip3 install kas
    - cd $CI_PROJECT_DIR/kas
    - if [ "$ENABLE_AWS_SUPPORT" == "Enabled" ]; then EXTRA_KAS_YAML="${EXTRA_KAS_YAML}${EXTRA_KAS_YAML:+:}awsci.yml"; fi
    - |
      if [[ -n "$META_ROS_GIT" ]] && [[ -n "$META_ROS_BRANCH" ]]; then
        cat <<EOF > custom-meta-ros.yml
      header:
        version: 14

      repos:
        ros:
          url: "$META_ROS_GIT"
          branch: $META_ROS_BRANCH
      EOF
        EXTRA_KAS_YAML="${EXTRA_KAS_YAML}${EXTRA_KAS_YAML:+:}custom-meta-ros.yml"
      fi
    - |
      if [ -n "$VIRTUAL_ENV_PKGS" ]; then
        cat <<EOF > custom-meta-virtualenv.yml
      header:
        version: 14

      repos:
        virtualenv:
          path: "${CI_PROJECT_DIR}/meta-virtualenv"
      EOF
        EXTRA_KAS_YAML="${EXTRA_KAS_YAML}${EXTRA_KAS_YAML:+:}custom-meta-virtualenv.yml"
      fi
    - echo kas build --update ${BITBAKE_TARGET:+--target} ${BITBAKE_TARGET} ${BITBAKE_TASK:+-c} ${BITBAKE_TASK} oeros-${OE_RELEASE_SERIES}-${ROS_DISTRO}-${MACHINE}.yml${EXTRA_KAS_YAML:+:}${EXTRA_KAS_YAML} -- ${EXTRA_BITBAKE_ARGS}
    - kas build --update ${BITBAKE_TARGET:+--target} ${BITBAKE_TARGET} ${BITBAKE_TASK:+-c} ${BITBAKE_TASK} oeros-${OE_RELEASE_SERIES}-${ROS_DISTRO}-${MACHINE}.yml${EXTRA_KAS_YAML:+:}${EXTRA_KAS_YAML} -- ${EXTRA_BITBAKE_ARGS}
  artifacts:
      name: "logs"
      when: always
      expire_in: 1 week
      paths:
        - $KAS_BUILD_DIR/bitbake-cookerdaemon.log
        - $KAS_BUILD_DIR/buildhistory/metadata-revs
        - $KAS_BUILD_DIR/conf/local.conf
        - $KAS_BUILD_DIR/tmp*/buildstats/**
        - $KAS_BUILD_DIR/tmp*/log/cooker/*
        - $KAS_BUILD_DIR/tmp*/error-report/*
        - $KAS_BUILD_DIR/tmp*/qa.log
