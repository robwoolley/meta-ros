header:
  version: 14

machine: "raspberrypi4-64"

repos:
  raspberrypi:
    url: "https://github.com/agherzan/meta-raspberrypi.git"
    path: "layers/meta-raspberrypi"

local_conf_header:
  raspberrypi: |
    # Set the accepted license flags to allow the use of commercial graphics drivers.
    LICENSE_FLAGS_ACCEPTED += "commercial synaptics-killswitch"
  # machine/raspberrypi4-64 and oeros/allow-commercial-licenses duplicate the machine:/local_conf_header
  # content above on fragment-capable releases -- see kas/oeros-distro.yml for why. Harmless, unused
  # content on scarthgap, which also includes this file but has no fragment support.
  #
  # Key name "raspberrypi4-64-fragments", not "fragments": local_conf_header keys are merged as one
  # flat dict across every included kas file, so a name reused elsewhere (including the "raspberrypi"
  # key just above, in this very file) would silently overwrite instead of both applying.
  raspberrypi4-64-fragments: |
    OE_FRAGMENTS += "machine/raspberrypi4-64 oeros/allow-commercial-licenses"
