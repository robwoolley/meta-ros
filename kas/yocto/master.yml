header:
  version: 14

defaults:
  repos:
    branch: "master"

repos:
  openembedded-core:
    url: "https://github.com/openembedded/openembedded-core.git"
    path: "layers/openembedded-core"
    layers:
      meta:

  bitbake:
    url: "https://github.com/openembedded/bitbake.git"
    path: "layers/bitbake"
    layers:
      bitbake: "disabled"

  meta-openembedded:
    url: "https://github.com/openembedded/meta-openembedded.git"
    path: "layers/meta-openembedded"
    layers:
      meta-filesystems:
      meta-gnome:
      meta-initramfs:
      meta-multimedia:
      meta-networking:
      meta-oe:
      meta-perl:
      meta-python:
      meta-webserver:
      meta-xfce:

  clang-revival:
    branch: "main"
    layers:
      meta-clang-revival: "disabled"

# Key name "master-fragments", not "fragments": local_conf_header keys are merged as one flat
# dict across every included kas file, so a name reused elsewhere would silently overwrite (or be
# overwritten by) that file's value instead of both applying -- see kas/oeros-distro.yml.
local_conf_header:
  master-fragments: |
    OE_FRAGMENTS += "oeros/qa/allow-license-format"
