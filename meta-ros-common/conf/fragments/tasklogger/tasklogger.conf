BB_CONF_FRAGMENT_SUMMARY = "Enable the tasklogger bbclass"
BB_CONF_FRAGMENT_DESCRIPTION = "Enable the tasklogger bbclass \
  - Inherits tasklogger globally, provided by the separate meta-tasklogger layer \
    (https://github.com/robwoolley/meta-tasklogger). \
  - Conditional on the tasklogger BBFILE_COLLECTIONS being present, so enabling this fragment \
    without the layer is a no-op instead of a hard parse error (tasklogger.bbclass would \
    otherwise not be found). Same trick used for cmake_qt5 in meta-ros-common's gz-gui9 recipe. \
"

INHERIT += "${@bb.utils.contains('BBFILE_COLLECTIONS', 'tasklogger', 'tasklogger', '', d)}"
