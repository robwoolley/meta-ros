BB_CONF_FRAGMENT_SUMMARY = "Build workarounds for the zenoh-c recipe"
BB_CONF_FRAGMENT_DESCRIPTION = "Build workarounds for the zenoh-c recipe \
  - Skips the buildpaths QA check for zenoh-c, whose build embeds absolute paths. \
  - Removes the -fcanon-prefix-map DEBUG_PREFIX_MAP entry for zenoh-c/zenoh-c-native; carried \
    forward from the kas-based build without re-verifying it is still needed on every release this \
    fragment is enabled on. \
  - NOTE: meta-oeros/conf/distro/include/zenoh.inc currently duplicates this content unconditionally; \
    the two need to be reconciled to one location before this fragment is relied on. \
"

INSANE_SKIP:pn-zenoh-c += "buildpaths"
DEBUG_PREFIX_MAP:remove:pn-zenoh-c = "-fcanon-prefix-map"
DEBUG_PREFIX_MAP:remove:pn-zenoh-c-native = "-fcanon-prefix-map"
